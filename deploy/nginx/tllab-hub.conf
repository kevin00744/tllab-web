# TL Lab Hub — Nginx 反向代理（Ubuntu 18.04 內建 nginx 1.14 可用）
# 放到 /etc/nginx/sites-available/tllab-hub.conf，並把網域改成你的網域。
# 先以 HTTP 啟動，再用 certbot --nginx 自動加上 HTTPS 設定。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 網頁
server {
    listen 80;
    server_name hub.example.edu.tw;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# 自架 Supabase API（使用 Supabase Cloud 時不需要這段）
server {
    listen 80;
    server_name supabase.example.edu.tw;

    client_max_body_size 50m;

    # 登入、資料、檔案、即時更新 API：對外開放
    location ~ ^/(auth|rest|storage|realtime|graphql|functions)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Supabase Studio 管理介面：只允許校內／實驗室網段（請改成你的網段）
    location / {
        allow 192.168.0.0/16;     # ← 改成實驗室／校內網段
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
