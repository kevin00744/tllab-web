# TL Lab Hub 對自架 Supabase 的覆寫設定
# 複製到 Supabase 的 docker 目錄，並在其 .env 設定：
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tllab.yml
#
# 1. 所有連接埠只綁定 127.0.0.1，對外一律經由 Nginx（HTTPS）。
#    Docker 發布的連接埠會繞過 ufw 防火牆，因此必須在這裡限制。
# 2. 啟用 Google 登入（GOOGLE_* 變數寫在同一份 .env）。
#
# 需要 Docker Compose >= 2.24.4（支援 !override）。

services:
  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000/tcp"

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"

  auth:
    environment:
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
